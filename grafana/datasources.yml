apiVersion: 1

# access: proxy — every query is made by the Grafana SERVER, which is inside the
# Railway project and can resolve *.railway.internal. access: direct makes the
# viewer's BROWSER dial that address, which never resolves off-platform.
prune: false

datasources:
  - name: Loki
    type: loki
    uid: railway_loki
    access: proxy
    orgId: 1
    url: $LOKI_URL
    isDefault: true
    jsonData:
      maxLines: 1000
  - name: Prometheus
    type: prometheus
    uid: railway_prometheus
    access: proxy
    orgId: 1
    url: $PROMETHEUS_URL
    isDefault: false
    jsonData:
      httpMethod: POST
      timeInterval: 15s
