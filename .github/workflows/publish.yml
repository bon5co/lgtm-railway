name: publish
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - service: grafana
            version: "13.0.2"
          - service: loki
            version: "3.7.7"
          - service: prometheus
            version: "v3.14.0"
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          push: true
          provenance: false
          tags: |
            ghcr.io/bon5co/lgtm-railway-${{ matrix.service }}:${{ matrix.version }}
            ghcr.io/bon5co/lgtm-railway-${{ matrix.service }}:latest
